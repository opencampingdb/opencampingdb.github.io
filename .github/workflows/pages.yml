# Publishes the site to GitHub Pages with the owner pages' place search,
# built from the latest data release. Runs on every push to main, every few
# hours to pick up new releases, and on request.

name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the latest data release
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/places.ndjson.gz" https://github.com/opencampingdb/data/releases/latest/download/places.ndjson.gz

      - name: Build the place search
        run: python3 -I scripts/build_place_search.py "$RUNNER_TEMP/places.ndjson.gz" owners/search

      - name: Collect the site
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude scripts ./ "$RUNNER_TEMP/site/"

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
