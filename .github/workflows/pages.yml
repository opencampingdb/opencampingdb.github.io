# Publishes the site to GitHub Pages with the owner pages' place search,
# built from the latest data release. Runs on every push to main, every few
# hours to pick up new releases, and on request.

name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The timed start comes from the feedback intake through workflow_dispatch.
  # The schedule above is a backup, so a scheduled run does nothing when a run
  # started another way (the intake, a push or by hand) is queued, running or
  # succeeded in the last 360 minutes. Scheduled runs are not counted, so
  # a skipped backup never makes the next backup skip. If the check fails,
  # the run goes ahead.
  due:
    name: Check if due
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for a run in this slot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: pages.yml
          WINDOW_MINUTES: "360"
        run: |
          run=true
          why="started by $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d "$WINDOW_MINUTES minutes ago" +%Y-%m-%dT%H:%M:%SZ)
            if runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f created=">=$since" -f per_page=100 --jq .workflow_runs); then
              other=$(jq -r --argjson self "$GITHUB_RUN_ID" '[.[]
                | select(.id != $self and .event != "schedule")
                | select(.status != "completed" or .conclusion == "success")][0]
                | if . then "run \(.id) (\(.event), \(.conclusion // .status))" else "" end' <<< "$runs")
              if [ -n "$other" ]; then
                run=false
                why="skipped, $other since $since"
              else
                why="no other run since $since"
              fi
            else
              why="could not list runs, running anyway"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice::run=$run, $why"

  build:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the latest data release
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/places.ndjson.gz" https://github.com/opencampingdb/data/releases/latest/download/places.ndjson.gz

      - name: Build the place search
        run: python3 -I scripts/build_place_search.py "$RUNNER_TEMP/places.ndjson.gz" owners/search

      - name: Collect the site
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude scripts ./ "$RUNNER_TEMP/site/"

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
